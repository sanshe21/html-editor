<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 编辑器 — 专为 AI 生成的 HTML 提供快速可视化的二次编辑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23111'/%3E%3Ctext x='18' y='26' text-anchor='middle' fill='white' font-size='22' font-weight='900' font-family='Inter,sans-serif'%3EH%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root {
  --bg:#f3f4f1;
  --paper:#fbfaf6;
  --ink:#171717;
  --muted:#7a7a72;
  --line:#e3e0d8;
  --line2:#d4d0c6;
  --dark:#111111;
  --accent:#6d5dfc;
  --accent2:#ff7a45;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --radius-xl:28px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(circle at 16% 8%,rgba(109,93,252,.12),transparent 26%),
    radial-gradient(circle at 86% 0%,rgba(255,122,69,.10),transparent 28%),
    linear-gradient(180deg,#faf9f5 0%,#ecebe5 100%);
}

/* ===== App shell ===== */
.app{
  height:100%;
  padding:14px;
  display:grid;
  grid-template-rows:58px 1fr;
  gap:14px;
}

/* ===== Topbar ===== */
.topbar{
  height:58px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(251,250,246,.78);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px 0 18px;
  box-shadow:0 20px 60px rgba(23,23,23,.06), inset 0 1px 0 rgba(255,255,255,.9);
  z-index:100;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:auto;
}
.mark{
  width:34px;height:34px;border-radius:12px;
  background:var(--dark);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:14px;
  letter-spacing:-.08em;
  box-shadow:0 10px 26px rgba(0,0,0,.18);
  flex-shrink:0;
}
.brand-text strong{
  display:block;
  font-size:14px;
  letter-spacing:-.03em;
  white-space:nowrap;
}
.brand-text span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
}
#editorTools{
  display:none;
  align-items:center;
  gap:6px;
}
.tb-btn{
  height:36px;
  border-radius:13px;
  border:1px solid var(--line2);
  padding:0 14px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  background:#fff;
  color:var(--ink);
  font-family:inherit;
  transition:all .18s;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tb-btn:hover{background:#f5f3ed;border-color:#c8c2b7}
.tb-btn:disabled{opacity:.35;pointer-events:none}
.tb-btn.dark{
  border-color:var(--dark);
  background:var(--dark);
  color:#fff;
  box-shadow:0 14px 30px rgba(0,0,0,.18);
  height:38px;
  border-radius:14px;
  padding:0 18px;
  font-size:14px;
  font-weight:900;
}
.tb-btn.dark:hover{background:#2a2a2a}
.tb-spacer{flex:1}

/* ===== Main layout ===== */
.layout{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:14px;
}

/* ===== Stage ===== */
.stage{
  border:1px solid var(--line);
  background:rgba(251,250,246,.76);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 24px 70px rgba(23,23,23,.07), inset 0 1px 0 rgba(255,255,255,.9);
  border-radius:28px;
  overflow:hidden;
  display:grid;
  grid-template-rows:50px 1fr;
}
.stage-head{
  height:50px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  flex-shrink:0;
}
.crumb{
  display:flex;
  align-items:center;
  gap:8px;
  color:#77746b;
  font-size:13px;
  font-weight:800;
}
.mode-switch{appearance:none;width:32px;height:18px;flex-shrink:0;margin:0;border:0;border-radius:18px;background:var(--line2);cursor:pointer}
.mode-switch::before{content:"";display:block;width:14px;height:14px;margin:2px;border-radius:50%;background:#fff;transition:transform .15s}
.mode-switch:checked{background:var(--accent)}
.mode-switch:checked::before{transform:translateX(14px)}
.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#77746b;
  font-size:12px;
  font-weight:800;
}
.status i{
  width:8px;height:8px;border-radius:99px;background:var(--save-color,#a1a1aa);display:block;
  box-shadow:0 0 0 5px rgba(0,0,0,.06);
}

/* ===== Canvas area ===== */
.canvas-wrap{
  min-height:0;
  padding:24px;
  position:relative;
  overflow:auto;
  background:
    linear-gradient(rgba(17,17,17,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,17,17,.035) 1px,transparent 1px);
  background-size:26px 26px;
}

/* ===== Welcome screen (overlay on canvas) ===== */
#welcomeScreen{
  position:absolute;
  inset:24px;
  border-radius:30px;
  background:linear-gradient(180deg,#fff 0%,#f8f6f1 100%);
  border:1px solid #ddd8ce;
  box-shadow:0 28px 80px rgba(17,17,17,.10), inset 0 2px 0 rgba(255,255,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  transition:opacity .35s ease;
}
#welcomeScreen.hidden{opacity:0;pointer-events:none}

/* Drop card inside welcome */
.drop{
  width:688px;
  padding:51px 45px 45px;
  border-radius:45px;
  text-align:center;
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#fff 0%,#f6f4ee 100%);
  border:1px solid #e1ddd2;
  box-shadow:0 24px 70px rgba(17,17,17,.10), inset 0 1px 0 #fff;
  transition:border-color .3s,box-shadow .3s;
}
.drop.drag-over{
  border-color:var(--accent);
  box-shadow:0 24px 70px rgba(17,17,17,.10), inset 0 1px 0 #fff, 0 0 0 6px rgba(109,93,252,.10);
}
.drop-icon{
  width:78px;height:78px;
  margin:0 auto 22px;
  border-radius:26px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:30px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.24),transparent 40%),
    linear-gradient(135deg,#111 0%,#2a2a2a 100%);
  box-shadow:0 22px 44px rgba(0,0,0,.22);
}
.drop h1{
  margin:0 auto 36px;
  font-size:26px;
  max-width:560px;
  line-height:1.25;
  letter-spacing:-.05em;
  color:var(--ink);
}
.drop p{
  margin:0 auto 22px;
  color:#77746b;
  font-size:13px;
  line-height:1.7;
  max-width:720px;
}
.drop-actions{
  display:flex;
  justify-content:center;
  gap:15px;
}
.upload-btn{
  height:62px;
  padding:0 42px;
  border-radius:32px;
  border:0;
  background:var(--dark);
  color:#fff;
  font-weight:900;
  font-size:29px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.upload-btn:hover{background:#2a2a2a;transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,0,0,.22)}
.sample-btn{
  height:42px;
  padding:0 20px;
  border-radius:15px;
  border:1px solid #ddd8ce;
  background:#fff;
  color:var(--ink);
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s;
}
.sample-btn:hover{background:#f5f3ed;border-color:#c8c2b7}

/* ===== Iframe (editing mode) ===== */
#iframeWrap{
  min-height:100%;
  border-radius:30px;
  overflow:hidden;
  background:var(--paper);
  border:1px solid #ddd8ce;
  box-shadow:0 28px 80px rgba(17,17,17,.10), inset 0 2px 0 rgba(255,255,255,.9);
}
#canvasIframe{
  width:100%;
  min-height:600px;
  border:none;
  display:block;
}

/* ===== Drag structure overlay ===== */
.group-box{position:absolute;outline:1px solid #6d5dfc80;outline-offset:-1px;color:#5144c9}
.group-box[data-context]{outline:1px dashed #64748b99;color:#64748b}
.group-box[data-hover]{outline-width:2px;outline-color:currentColor;background:#6d5dfc18;z-index:1}
.group-arrow{position:absolute;width:6px;height:6px;background:currentColor;clip-path:polygon(100% 0,100% 100%,0 50%)}
.group-arrow[data-active]{color:#17172b}
.group-label{position:absolute;z-index:2;max-width:min(380px,calc(100% - 12px));padding:5px 8px;border-radius:4px;background:#252538;color:#fff;font:12px/1.6 ui-monospace,monospace;white-space:pre;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px #0003}

/* ===== Props panel ===== */
.props{
  border:1px solid var(--line);
  background:rgba(251,250,246,.76);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 24px 70px rgba(23,23,23,.07), inset 0 1px 0 rgba(255,255,255,.9);
  border-radius:28px;
  overflow:hidden;
  display:grid;
  grid-template-rows:58px 1fr;
}
.props-head{
  height:58px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  flex-shrink:0;
}
.props-head strong{
  font-size:15px;
  letter-spacing:-.03em;
}
.tag{
  font-size:12px;
  color:var(--accent);
  background:rgba(109,93,252,.10);
  padding:5px 10px;
  border-radius:99px;
  font-weight:900;
}
.props-body{
  padding:18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* Empty state card */
.empty-card{
  border-radius:24px;
  border:1px solid #e4dfd5;
  background:linear-gradient(180deg,#fff,#f6f4ee);
  padding:20px;
  box-shadow:0 16px 40px rgba(17,17,17,.06);
}
.preview-box{
  height:96px;
  border-radius:18px;
  background:
    radial-gradient(circle at 30% 20%,rgba(109,93,252,.18),transparent 34%),
    linear-gradient(135deg,#222,#111);
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.preview-box:after{
  content:"";
  position:absolute;
  left:20px;right:20px;bottom:18px;height:8px;
  border-radius:99px;
  background:rgba(255,255,255,.22);
  box-shadow:0 -18px 0 rgba(255,255,255,.12);
}
.empty-card h3{
  margin:0 0 8px;
  font-size:15px;
  letter-spacing:-.04em;
}
.empty-card p{
  margin:0;
  color:#77746b;
  font-size:12px;
  line-height:1.7;
}

/* ===== Dynamic props form elements ===== */
.props-empty{
  color:var(--muted);
  font-size:13px;
  text-align:center;
  padding:20px 0;
  line-height:1.6;
}
.prop-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding-top:14px;
  border-top:1px solid #e4dfd5;
}
.prop-group:first-child{border-top:none;padding-top:0}
.prop-label{
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
  color:var(--muted);
}
.prop-input,.prop-textarea,.prop-select{
  padding:9px 11px;
  border:1px solid #ded9cf;
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-size:13px;
  font-family:inherit;
  outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.prop-input:focus,.prop-textarea:focus,.prop-select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(109,93,252,.08);
}
.prop-textarea{resize:vertical;min-height:60px}
.prop-input[type="color"]{padding:4px 8px;height:38px;cursor:pointer}
.prop-row{display:flex;gap:8px}
.prop-row .prop-input{flex:1;min-width:0}
.prop-row-inner{display:flex;gap:5px;align-items:center;min-width:0}
.prop-row-inner label{font-size:11px;color:var(--muted);font-weight:800;min-width:14px;flex-shrink:0}
/* Label-above-input grid for size + padding — one row per control */
.prop-lbl{display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);user-select:none;transition:color .15s;white-space:nowrap;width:36px;flex-shrink:0;cursor:ew-resize;letter-spacing:.5px}
.prop-lbl:hover{color:var(--accent)}
.prop-lbl[data-axis="y"]{cursor:ns-resize}
.prop-lbl .ar{font-size:7px;opacity:.35;font-weight:400}
.scrub-icon{font-size:13px;color:var(--muted);cursor:ew-resize;user-select:none;transition:color .15s;flex-shrink:0;line-height:1;padding:0 2px}
.scrub-icon:hover{color:var(--accent)}
.reset-btn{font-size:11px;cursor:pointer;opacity:.35;transition:opacity .15s;margin-left:2px;user-select:none}
.reset-btn:hover{opacity:1;color:var(--accent2)}
.prop-btn{
  padding:7px 14px;
  border:1px solid var(--line2);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:all .18s;
  font-family:inherit;
}
.prop-btn:hover{background:#f5f3ed;border-color:#c8c2b7}
.prop-btn.danger{color:var(--accent2);border-color:rgba(255,122,69,.25)}
.prop-btn.danger:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}

/* Align buttons */
.align-group{display:flex;gap:2px}
.align-btn{
  flex:1;padding:7px;border:1px solid #ded9cf;background:#fff;
  color:var(--muted);font-size:13px;cursor:pointer;text-align:center;
  transition:all .18s;font-family:inherit;
}
.align-btn:first-child{border-radius:10px 0 0 10px}
.align-btn:last-child{border-radius:0 10px 10px 0}
.align-btn:hover{background:#f5f3ed}
.align-btn.active{background:var(--dark);border-color:var(--dark);color:#fff}

/* ===== Add panel dropdown ===== */
#addPanel{
  position:fixed;
  top:80px;
  left:200px;
  background:rgba(251,250,246,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:18px;
  border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(23,23,23,.12);
  padding:8px;
  display:none;
  z-index:500;
  min-width:190px;
}
#addPanel.show{display:block}
.add-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:11px;
  cursor:pointer;font-size:13px;font-weight:700;
  transition:background .15s;
  border:none;background:transparent;color:var(--ink);
  width:100%;text-align:left;font-family:inherit;
}
.add-item:hover{background:rgba(109,93,252,.08);color:var(--accent)}

/* ===== Toast ===== */
#toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:#fff;
  padding:10px 24px;border-radius:20px;
  font-size:13px;font-weight:600;
  z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .3s;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}
#toast.show{opacity:1}

/* ===== Utility ===== */
.canvas-hidden{display:none !important}

/* ===== Responsive ===== */
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .props{display:none}
  .brand-text span{display:none}
}
@media(max-width:600px){
  .app{padding:8px;gap:8px}
  .topbar{padding:0 8px 0 12px;border-radius:16px}
  .tb-btn{padding:0 10px;font-size:12px}
  .tb-btn span{display:none}
  .brand-text strong{font-size:12px}
  .drop{width:auto;padding:24px 18px}
  .canvas-wrap{padding:12px}
  #welcomeScreen{inset:12px;border-radius:20px}
  #iframeWrap{border-radius:20px}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Topbar ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-text">
        <strong>HTML 编辑器</strong>
        <span>专为 AI 生成的 HTML 提供快速的二次编辑</span>
      </div>
    </div>

    <span id="editorTools" style="margin-left:8px">
      <button class="tb-btn" id="btnAdd" onclick="toggleAddPanel()">+ <span>添加</span></button>
      <button class="tb-btn" id="btnUndo" onclick="undo()" disabled>&#8630; <span>撤销</span></button>
      <button class="tb-btn" id="btnRedo" onclick="redo()" disabled>&#8631; <span>重做</span></button>
    </span>

    <span class="tb-spacer"></span>

    <div class="actions" style="display:flex;align-items:center;gap:6px">
      <button class="tb-btn" onclick="openFile()">打开 HTML</button>
      <button class="tb-btn" id="btnSave" onclick="saveFile()" title="保存到源 HTML 文件">保存</button>
      <button class="tb-btn" onclick="exportFile(true)" title="在新标签页预览">预览</button>
      <button class="tb-btn dark" onclick="exportFile()">导出 HTML</button>
      <button class="tb-btn" onclick="exportPNG()">导出 PNG</button>
      <button class="tb-btn" onclick="composeImage()">合成图片</button>
      <button class="tb-btn" onclick="showAbout()" style="font-weight:500">关于</button>
    </div>
  </header>

  <!-- ===== Main content ===== -->
  <main class="layout">
    <section class="stage">
      <div class="stage-head">
        <span id="statusText" style="display:none"></span>
        <div class="status"><i></i><span id="saveStatus" title="当前文件保留最近 300 步撤销；关闭编辑器或切换文件后清空">打开源文件后自动保存，每 3 秒检查更新</span></div>
        <div class="crumb">
          <label class="crumb" title="可操作页内交互，页面跳转请使用顶部预览"><input class="mode-switch" type="checkbox" role="switch" onchange="setInteractiveMode(this.checked)">交互模式</label>
          <button class="tb-btn" onclick="zoomCanvas(-0.25)" title="缩小网页" aria-label="缩小网页">−</button>
          <span id="zoomLevel">100%</span>
          <button class="tb-btn" onclick="zoomCanvas(0.25)" title="放大网页" aria-label="放大网页">+</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasContainer">
        <!-- Welcome overlay -->
        <div id="welcomeScreen">
          <div class="drop" id="welcomeDropZone">

            <h1>把 HTML 拖进来，开始像设计稿一样编辑</h1>

            <div class="drop-actions">
              <button class="upload-btn" onclick="event.stopPropagation();openFile()">导入 HTML</button>

            </div>
          </div>
        </div>

        <!-- Iframe wrapper (behind welcome screen) -->
        <div id="iframeWrap">
          <iframe id="canvasIframe" class="canvas-hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        </div>
      </div>
    </section>

    <!-- ===== Properties panel ===== -->
    <aside class="props" id="propsPanel">
      <div class="props-head">
        <strong>属性调整</strong>
        <div style="display:flex;align-items:center;gap:5px">
          <button class="tb-btn" onclick="undo()" id="btnUndo2" disabled style="font-size:11px;padding:0 7px;height:28px;border-radius:9px;min-width:28px" title="撤销">↶</button>
          <button class="tb-btn" onclick="redo()" id="btnRedo2" disabled style="font-size:11px;padding:0 7px;height:28px;border-radius:9px;min-width:28px" title="重做">↷</button>
          <button class="tb-btn" onclick="resetAll()" style="font-size:11px;padding:0 8px;height:28px;border-radius:9px;color:#ff7a45;border-color:rgba(255,122,69,.3);white-space:nowrap" title="一键重置">↺ 重置</button>
          <span class="tag" id="elementTag">未选择</span>
        </div>
      </div>
      <div class="props-body" id="propsBody">
        <div class="empty-card">
          <div class="preview-box"></div>
          <h3>选择画布中的元素</h3>
          <p>点击文字、图片、按钮或区块后，可在这里编辑尺寸、颜色、圆角、间距与层级。</p>
        </div>
      </div>
    </aside>
  </main>
</div>

<!-- ===== Overlays & hidden inputs ===== -->
<div id="addPanel">

<input type="file" id="fileInput" accept=".html,.htm" hidden onchange="handleFileSelect(event)">

<script>
/* ========================================================================
   STATE
   ======================================================================== */
let selectedElement = null;
let selectionState = null;
let undoStack = [];
let redoStack = [];
let resizeData = null;
let editSavedContent = null;
let handles = [];
let _toastTimer = null;
let _mutationObserver = null;
let editOutlineSheet = null;
let _sizeRAF = null;
let _scrubState = null;
let _moveData = null;
let interactiveMode = false;
let saveTimer = null;
let previewDocument = null;
let openingFile = false;
let sourceFileHandle = null;
let sourceFileName = 'index.html';
let historyHTML = '', savedHTML = '', sourceHTML = '';
let fileTask = Promise.resolve(), fileOperations = 0, syncing = false;
const HTML_FILE_TYPES = [{ accept: { 'text/html': ['.html', '.htm'] } }];

function getTranslate(el) {
  const t = el.style.transform;
  if (!t || t === 'none') return { x: 0, y: 0 };
  const m = t.match(/translate\(([^)]+)\)/);
  if (!m) return { x: 0, y: 0 };
  const parts = m[1].split(',').map(s => parseFloat(s) || 0);
  return { x: parts[0] || 0, y: parts[1] || 0 };
}

/* ========================================================================
   IFRAME HELPERS
   ======================================================================== */
function getDoc() {
  const iframe = document.getElementById('canvasIframe');
  const doc = iframe && iframe.contentDocument;
  return doc === previewDocument ? doc : null;
}
function getWin() {
  const iframe = document.getElementById('canvasIframe');
  return iframe && iframe.contentWindow;
}
function getRoot() {
  const doc = getDoc();
  return doc ? (doc.body || doc.documentElement) : null;
}

/* ========================================================================
   LOAD HTML INTO IFRAME
   ======================================================================== */
function loadHTML(htmlString) {
  clearTimeout(saveTimer);
  hasLoadedDocument = false;
  previewDocument = null;
  setSaveStatus('正在载入...');
  // Install navigation guards before the imported page's scripts can run.
  const source = new DOMParser().parseFromString(htmlString, 'text/html');
  const guard = source.createElement('script');
  guard.textContent = 'parent.guardPreview(document);document.currentScript.remove();';
  source.head.prepend(guard);
  return new Promise((resolve, reject) => {
    const iframe = document.getElementById('canvasIframe');
    iframe.onload = () => {
      try {
        if (!getDoc()) {
          hasLoadedDocument = false;
          iframe.classList.add('canvas-hidden');
          setSaveStatus('页面已跳转，请重新打开源文件', '#ef4444');
          return reject(new Error('Preview document was replaced'));
        }
        setupIframeListeners();
        createHandles();
        autoSizeIframe();
        hasLoadedDocument = true;
        resolve();
      } catch (e) { reject(e); }
    };
    iframe.srcdoc = (source.doctype ? new XMLSerializer().serializeToString(source.doctype) : '') + source.documentElement.outerHTML;
  });
}

function guardPreview(doc) {
  previewDocument = doc;
  const win = doc.defaultView;
  // Drops inside an iframe do not bubble to the editor window.
  win.addEventListener('dragover', e => {
    if (e.dataTransfer?.types.includes('Files')) _preventDrag(e);
  }, true);
  win.addEventListener('drop', e => {
    if (e.dataTransfer?.files.length) handleFileDrop(e);
  }, true);
  const blocked = () => showToast('画布内已阻止页面跳转，请使用顶部“预览”');
  win.navigation?.addEventListener('navigate', e => {
    if (doc !== previewDocument || e.destination.sameDocument || !e.cancelable) return;
    e.preventDefault();
    blocked();
  });
  // Run after page click handlers so dropdowns/tabs can handle their own links.
  const onLink = e => {
    const link = e.target.closest?.('a[href], area[href]');
    if (!link || e.defaultPrevented) return;
    e.preventDefault();
    if (!interactiveMode) return;
    const href = link.getAttribute('href').trim();
    if (e.type === 'click' && href.startsWith('#')) win.location.hash = href;
    else if (href && !/^javascript:\s*void\s*\(/i.test(href)) blocked();
  };
  win.addEventListener('click', onLink);
  win.addEventListener('auxclick', onLink);
  doc.addEventListener('submit', e => {
    if (e.defaultPrevented || (e.submitter?.formMethod || e.target.method) === 'dialog') return;
    e.preventDefault();
    blocked();
  }, true);
  // form.submit() bypasses the submit event; dialog forms must still close normally.
  const submit = win.HTMLFormElement.prototype.submit;
  win.HTMLFormElement.prototype.submit = function () {
    if (this.method === 'dialog') return submit.call(this);
    blocked();
  };
  win.addEventListener('beforeunload', () => { if (doc === previewDocument) finishEditing(); });
}

function setInteractiveMode(enabled) {
  finishEditing();
  interactiveMode = enabled;
  showEditOutlines();
  deselectElement();
  autoSizeIframe();
}

function showEditOutlines(enabled = !interactiveMode && !_moveData?.moved) {
  if (editOutlineSheet) editOutlineSheet.disabled = !enabled;
}

function zoomCanvas(step) {
  const iframe = document.getElementById('canvasIframe');
  const zoom = Math.min(2, Math.max(0.25, (parseFloat(iframe.style.zoom) || 1) + step));
  iframe.style.zoom = zoom;
  document.getElementById('iframeWrap').style.width = Math.max(1, zoom) * 100 + '%';
  document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
  autoSizeIframe();
  if (selectedElement) showHandles(selectedElement);
}

function autoSizeIframe() {
  const doc = getDoc();
  const iframe = document.getElementById('canvasIframe');
  const wrap = document.getElementById('canvasContainer');
  if (!doc || !doc.body) return;
  const st = wrap.scrollTop;
  // Measure from a fixed viewport so 100vh pages cannot grow on every edit.
  iframe.style.minHeight = '600px';
  const h = Math.max(600, doc.body.scrollHeight + 80);
  iframe.style.minHeight = h + 'px';
  wrap.scrollTop = st;
  if (_moveData?.moved) drawGroupTargets();
}

/* ========================================================================
   EVENT LISTENERS INSIDE IFRAME
   ======================================================================== */
function setupIframeListeners() {
  const doc = getDoc();
  if (!doc) return;
  // A constructed stylesheet follows layout without changing or serializing the source DOM.
  editOutlineSheet = new (getWin().CSSStyleSheet)();
  editOutlineSheet.replaceSync('body,body *:not(.__ve-handle){outline:1px solid #6d5dfc55!important;outline-offset:-1px!important}');
  doc.adoptedStyleSheets.push(editOutlineSheet);
  showEditOutlines();
  doc.addEventListener('input', scheduleSave, true);
  doc.addEventListener('keydown', onShortcut, true);

  // Capture page actions in edit mode; leave them untouched in interactive mode.
  doc.addEventListener('pointerdown', e => { if (!interactiveMode) e.stopPropagation(); }, true);
  doc.addEventListener('click', (e) => {
    if (interactiveMode) return;
    e.stopPropagation();
    if (resizeData) return;
    if (editSavedContent !== null) return;
    e.preventDefault();
    if (_justMoved) { _justMoved = false; return; }
    let el = e.target;
    // Walk up from text nodes to their parent element
    while (el && el.nodeType !== 1) el = el.parentElement;
    if (!el) return;
    if (el.classList.contains('__ve-handle')) return;
    if (el === doc.body || el === doc.documentElement) { deselectElement(); return; }
    if (['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) return;
    // Already-selected text element → second click enters edit mode
    if (el === selectedElement) {
      if (isTextElement(el)) {
        const cx = e.clientX, cy = e.clientY;
        setTimeout(() => startEditAtCursor(el, cx, cy), 0);
      }
      return;
    }
    selectElement(el);
  }, true);

  // Mousedown on selected element → prepare drag-to-move (not on handles)
  doc.addEventListener('mousedown', (e) => {
    if (interactiveMode || e.target.classList.contains('__ve-handle')) return;
    e.stopPropagation();
    if (e.button !== 0) return;
    if (resizeData) return;
    if (editSavedContent !== null) return;
    e.preventDefault();
    if (_scrubState) return;
    _justMoved = false;
    let el = e.target;
    while (el && el.nodeType !== 1) el = el.parentElement;
    if (!el) return;
    if (el.classList.contains('__ve-handle')) return;
    if (el === doc.body || el === doc.documentElement) return;
    if (['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) return;
    if (el === selectedElement) {
      const tr = getTranslate(el);
      _moveData = {
        el: el,
        startX: e.clientX,
        startY: e.clientY,
        startLeft: parseFloat(el.style.left) || 0,
        startTop: parseFloat(el.style.top) || 0,
        originalStyle: el.getAttribute('style'),
        startTx: tr,
        moved: false,
        wasStatic: !el.style.position || el.style.position === 'static'
      };
    }
  }, true);

  // Scroll inside iframe → update handle positions
  const win = getWin();
  if (win) {
    win.addEventListener('blur', onDragUp);
    win.addEventListener('scroll', () => {
      if (_moveData?.moved) drawGroupTargets();
      if (selectedElement) showHandles(selectedElement);
    }, true);
  }

  // Drag move/up inside iframe — critical for smooth resize (iframe has own event context)
  doc.addEventListener('mousemove', onDragMove);
  doc.addEventListener('mouseup', onDragUp, true);

  // Mutation observer to auto-resize iframe
  if (doc.body) {
    if (_mutationObserver) _mutationObserver.disconnect();
    _mutationObserver = new MutationObserver(() => {
      if (resizeData || _sizeRAF) return;
      _sizeRAF = requestAnimationFrame(() => {
        _sizeRAF = null;
        if (getDoc() === doc && !resizeData) autoSizeIframe();
      });
    });
    _mutationObserver.observe(doc.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  }
}

/* ========================================================================
   HANDLES (inside iframe, position:fixed)
   ======================================================================== */
function createHandles() {
  const doc = getDoc();
  if (!doc || !doc.body) return;
  handles.forEach(h => { if (h.parentNode) h.parentNode.removeChild(h); });
  handles = [];

  const dirs = ['nw','n','ne','e','se','s','sw','w'];
  const cursorMap = { nw:'nw-resize',n:'n-resize',ne:'ne-resize',e:'e-resize',se:'se-resize',s:'s-resize',sw:'sw-resize',w:'w-resize' };
  dirs.forEach(dir => {
    const h = doc.createElement('div');
    h.className = '__ve-handle';
    h.setAttribute('style', [
      'position:fixed','width:10px','height:10px','background:#fff',
      'border:2px solid #6d5dfc','border-radius:50%','z-index:2147483647',
      'display:none','pointer-events:auto','cursor:' + cursorMap[dir]
    ].join(';'));
    h.dataset.handle = dir;
    h.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); startResize(e, dir); });
    doc.body.appendChild(h);
    handles.push(h);
  });
}

function showHandles(el) {
  if (!el || !el.isConnected || _moveData?.moved) { hideHandles(); return; }
  // Recreate if handles lost (e.g. after undo)
  if (handles.length === 0 || !handles[0].isConnected) createHandles();

  const rect = el.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const l = rect.left, t = rect.top;

  const positions = {
    nw: [l-5, t-5], n: [l+w/2, t-5], ne: [l+w+5, t-5],
    e: [l+w+5, t+h/2], se: [l+w+5, t+h+5], s: [l+w/2, t+h+5],
    sw: [l-5, t+h+5], w: [l-5, t+h/2]
  };

  handles.forEach(h => {
    const [x, y] = positions[h.dataset.handle];
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.style.display = 'block';
  });
}

function hideHandles() {
  handles.forEach(h => { if (h.isConnected) h.style.display = 'none'; });
}

/* ========================================================================
   SELECTION
   ======================================================================== */
function selectElement(el) {
  deselectElement();
  selectedElement = el;
  selectionState = {
    styles: ['outline', 'outline-offset', 'cursor'].map(p => [p, el.style.getPropertyValue(p), el.style.getPropertyPriority(p)]),
    editable: el.getAttribute('contenteditable'), style: el.getAttribute('style'), cssText: el.style.cssText
  };
  el.style.setProperty('outline', '2px solid #6d5dfc', 'important');
  el.style.setProperty('outline-offset', '2px', 'important');
  el.style.cursor = 'move';
  showHandles(el);
  updatePropsPanel(el);
  document.getElementById('elementTag').textContent = '<' + el.tagName.toLowerCase() + '>';
  document.getElementById('statusText').textContent = '已选中';
}

function restoreSelection(el) {
  selectionState.styles.forEach(([p, value, priority]) => el.style.setProperty(p, value, priority));
  if (selectionState.editable === null) el.removeAttribute('contenteditable');
  else el.setAttribute('contenteditable', selectionState.editable);
  if (el.style.cssText === selectionState.cssText) {
    if (selectionState.style === null) {
      // Reading first synchronizes Chromium's pending inline style attribute.
      if (el.hasAttribute('style')) el.removeAttribute('style');
    } else el.setAttribute('style', selectionState.style);
  }
}

function deselectElement() {
  if (selectedElement && selectedElement.isConnected) {
    if (editSavedContent !== null) selectedElement.blur();
    restoreSelection(selectedElement);
  }
  selectedElement = null;
  hideHandles();
  showEmptyProps();
  document.getElementById('elementTag').textContent = '未选择';
  document.getElementById('statusText').textContent = '就绪';
}

/* ========================================================================
   RESIZE
   ======================================================================== */
function startResize(e, dir) {
  if (!selectedElement) return;
  const el = selectedElement;
  const rect = el.getBoundingClientRect();

  resizeData = {
    el, dir,
    startX: e.clientX, startY: e.clientY,
    startW: rect.width, startH: rect.height,
    startLeft: parseFloat(el.style.left) || 0,
    startTop: parseFloat(el.style.top) || 0,
    wasStatic: !el.style.position || el.style.position === 'static',
    isInline: isInlineText(el)
  };

  // Inline elements ignore width/height — promote to inline-block during resize
  if (resizeData.isInline) el.style.display = 'inline-block';

  if (_mutationObserver) try { _mutationObserver.disconnect(); } catch(e) {}
}

let _resizeRAF = null;
let _justMoved = false;

function movePoint(e) {
  const frame = document.getElementById('canvasIframe'), rect = frame.getBoundingClientRect();
  const zoom = parseFloat(frame.style.zoom) || 1;
  const outside = e.view === window || e.target?.ownerDocument === document;
  return { x: outside ? (e.clientX - rect.left) / zoom : e.clientX, y: outside ? (e.clientY - rect.top) / zoom : e.clientY,
    clientX: outside ? e.clientX : rect.left + e.clientX * zoom, clientY: outside ? e.clientY : rect.top + e.clientY * zoom };
}

function groupTag(target, dragged) {
  if (!target.isConnected || !dragged.isConnected || target.contains(dragged) || dragged.contains(target)) return;
  if (target.closest('.__ve-handle') || [target, dragged].some(el => el.namespaceURI !== 'http://www.w3.org/1999/xhtml' && el.tagName !== 'svg')) return;
  if (/^(SCRIPT|STYLE|LINK|META|TEMPLATE|BR)$/.test(target.tagName)) return;
  const parent = target.parentElement;
  if (!parent || parent.namespaceURI !== 'http://www.w3.org/1999/xhtml' || /^(HTML|HEAD|TABLE|THEAD|TBODY|TFOOT|TR|COLGROUP|UL|OL|MENU|DL|SELECT|OPTGROUP|PICTURE)$/.test(parent.tagName)) return;
  if (target.closest('a,button') && (dragged.matches('a,button,input,select,textarea') || dragged.querySelector('a,button,input,select,textarea'))) return;
  const inline = /^(P|H[1-6]|SPAN|A|BUTTON|LABEL|PRE|EM|STRONG|B|I|U|S|SMALL|CODE|SUB|SUP|MARK|TIME|ABBR)$/;
  if (inline.test(parent.tagName)) {
    if (![target, dragged].every(el => inline.test(el.tagName) || /^(IMG|INPUT|TEXTAREA|SELECT|SVG|CANVAS)$/.test(el.tagName.toUpperCase()))) return;
    if ([target, dragged].some(el => /^(P|H[1-6]|PRE)$/.test(el.tagName))) return;
    return 'span';
  }
  return 'div';
}

function drawGroupTargets() {
  const move = _moveData;
  if (!move?.moved) return;
  if (!move.overlay) {
    // Keep ancestors and restricted containers visible as structure, without drop arrows.
    move.targets = [getDoc().body, ...getDoc().body.querySelectorAll('*')].filter(el =>
      !move.el.contains(el) && !el.closest('.__ve-handle') && !/^(SCRIPT|STYLE|LINK|META|TEMPLATE|BR)$/.test(el.tagName));
    move.boxes = new Map();
    move.overlay = document.createElement('div');
    move.overlay.id = 'groupDropTargets';
    move.overlay.setAttribute('aria-hidden', 'true');
    move.overlay.style.cssText = 'position:fixed;overflow:hidden;pointer-events:none;z-index:2000';
    move.label = document.createElement('div');
    move.label.className = 'group-label'; move.label.hidden = true;
    move.overlay.appendChild(move.label);
    document.body.appendChild(move.overlay);
  }
  const frame = document.getElementById('canvasIframe'), f = frame.getBoundingClientRect();
  const canvas = document.getElementById('canvasContainer').getBoundingClientRect(), zoom = parseFloat(frame.style.zoom) || 1;
  const view = { left: Math.max(canvas.left, f.left), top: Math.max(canvas.top, f.top), right: Math.min(canvas.right, f.right), bottom: Math.min(canvas.bottom, f.bottom) };
  view.width = Math.max(0, view.right - view.left); view.height = Math.max(0, view.bottom - view.top);
  move.view = view;
  Object.assign(move.overlay.style, { left: view.left + 'px', top: view.top + 'px', width: view.width + 'px', height: view.height + 'px' });
  move.points = [];
  const clips = new Map(), slots = new Map();
  const occupied = (x, y) => {
    const cx = Math.floor(x / 10), cy = Math.floor(y / 10);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      if (slots.get((cx + dx) + ':' + (cy + dy))?.some(p => Math.abs(p.x - x) < 10 && Math.abs(p.y - y) < 10)) return true;
    }
    return false;
  };
  for (const target of move.targets) {
    const r = target.getBoundingClientRect(), style = getWin().getComputedStyle(target);
    const left = f.left + r.left * zoom, top = f.top + r.top * zoom, right = left + r.width * zoom, bottom = top + r.height * zoom;
    const clip = clips.get(target.parentElement) || view, childClip = { ...clip };
    if (/^(hidden|clip|auto|scroll)$/.test(style.overflowX)) {
      childClip.left = Math.max(clip.left, left + target.clientLeft * zoom);
      childClip.right = Math.min(clip.right, left + (target.clientLeft + target.clientWidth) * zoom);
    }
    if (/^(hidden|clip|auto|scroll)$/.test(style.overflowY)) {
      childClip.top = Math.max(clip.top, top + target.clientTop * zoom);
      childClip.bottom = Math.min(clip.bottom, top + (target.clientTop + target.clientHeight) * zoom);
    }
    clips.set(target, childClip);
    const visible = target.isConnected && r.width > 0 && r.height > 0 && clip.right > clip.left && clip.bottom > clip.top && right > clip.left && left < clip.right && bottom > clip.top && top < clip.bottom && style.visibility === 'visible';
    let item = move.boxes.get(target);
    if (!visible) { item?.box.remove(); move.boxes.delete(target); continue; }
    if (!item) {
      const box = document.createElement('div'), groupable = !!groupTag(target, move.el);
      box.className = 'group-box'; box.toggleAttribute('data-context', !groupable);
      const markers = (groupable ? [0, 1, 2, 3] : []).map(side => {
        const marker = document.createElement('span');
        marker.className = 'group-arrow';
        marker.style.transform = 'translate(-50%,-50%) rotate(' + side * 90 + 'deg)';
        box.appendChild(marker); return marker;
      });
      item = { target, box, markers };
      move.overlay.appendChild(box); move.boxes.set(target, item);
    }
    Object.assign(item, { left, top, right, bottom, clip });
    item.label = target.localName + (target.id ? '#' + target.id : [...target.classList].slice(0, 2).map(c => '.' + c).join('')) + ' · ' + style.display + ' · ' + Math.round(r.width) + ' × ' + Math.round(r.height);
    Object.assign(item.box.style, { left: (left - view.left) + 'px', top: (top - view.top) + 'px', width: r.width * zoom + 'px', height: r.height * zoom + 'px',
      clipPath: 'inset(' + [clip.top - top, right - clip.right, bottom - clip.bottom, clip.left - left].map(n => Math.max(-12, n) + 'px').join(' ') + ')' });
    // Tiny arrows stay inside their box; opposing arrows use different positions along the edge.
    const size = Math.min(6, right - left, bottom - top), ix = Math.min(5, (right - left) / 2), iy = Math.min(5, (bottom - top) / 2);
    [[left + ix, top + (bottom - top) * 2 / 3], [left + (right - left) / 3, top + iy], [right - ix, top + (bottom - top) / 3], [left + (right - left) * 2 / 3, bottom - iy]].forEach(([x, y], side) => {
      const marker = item.markers[side];
      if (!marker) return;
      const vertical = side % 2 === 0;
      const start = Math.max(vertical ? top : left, vertical ? clip.top : clip.left), end = Math.min(vertical ? bottom : right, vertical ? clip.bottom : clip.right);
      const inset = Math.min(5, (end - start) / 2), min = start + inset, max = end - inset;
      const base = Math.max(min, Math.min(max, vertical ? y : x));
      if (vertical) y = base; else x = base;
      // Shared parent/child edges also need distinct, individually reachable arrows.
      for (let step = 1; occupied(x, y) && step <= Math.ceil((max - min) / 6); step++) {
        const next = base + (step % 2 ? 1 : -1) * Math.ceil(step / 2) * 12;
        if (next >= min && next <= max) { if (vertical) y = next; else x = next; }
      }
      marker.style.left = (x - left) + 'px'; marker.style.top = (y - top) + 'px';
      marker.style.width = marker.style.height = size + 'px';
      const visible = x >= clip.left && x <= clip.right && y >= clip.top && y <= clip.bottom;
      marker.style.display = visible ? 'grid' : 'none';
      if (visible) {
        const point = { target, side, marker, item, x, y }, key = Math.floor(x / 10) + ':' + Math.floor(y / 10);
        move.points.push(point);
        if (!slots.has(key)) slots.set(key, []);
        slots.get(key).push(point);
      }
    });
  }
  updateGroupTarget();
}

function updateGroupTarget() {
  const move = _moveData;
  if (!move?.point) return;
  const x = move.point.clientX, y = move.point.clientY;
  const view = move.view;
  const inside = x >= view.left && x <= view.right && y >= view.top && y <= view.bottom;
  let drop = null, hover = null, distance = inside ? 8 : -1;
  for (const item of move.boxes.values()) {
    if (inside && x >= Math.max(item.left, item.clip.left) && x <= Math.min(item.right, item.clip.right) && y >= Math.max(item.top, item.clip.top) && y <= Math.min(item.bottom, item.clip.bottom)) hover = item;
  }
  for (const point of move.points || []) {
    const clip = point.item.clip;
    if (x < clip.left || x > clip.right || y < clip.top || y > clip.bottom) continue;
    const d = Math.hypot(point.x - x, point.y - y);
    if (d <= distance) { distance = d; drop = point; }
  }
  if (drop?.marker !== move.drop?.marker) {
    move.drop?.marker.removeAttribute('data-active');
    drop?.marker.setAttribute('data-active', '');
  }
  move.drop = drop;
  hover = drop?.item || hover;
  if (hover !== move.hover) {
    move.hover?.box.removeAttribute('data-hover');
    hover?.box.setAttribute('data-hover', '');
    move.hover = hover;
  }
  move.label.hidden = !hover;
  if (hover) {
    move.label.textContent = hover.label + (drop ? '\n' + ['← 放在左侧 · 横向组合', '↑ 放在上方 · 纵向组合', '→ 放在右侧 · 横向组合', '↓ 放在下方 · 纵向组合'][drop.side] : '');
    move.label.style.left = Math.max(6, Math.min(hover.left - view.left, view.width - 386)) + 'px';
    move.label.style.top = Math.max(6, hover.top - view.top - (drop ? 56 : 34)) + 'px';
  }
}

function groupElements(dragged, target, side) {
  const tag = groupTag(target, dragged);
  if (!tag) return false;
  const parentStyle = getWin().getComputedStyle(target.parentElement);
  const group = getDoc().createElement(tag), horizontal = side % 2 === 0;
  group.style.cssText = 'display:' + (tag === 'span' ? 'inline-flex' : 'flex') + ';min-width:0;flex-wrap:nowrap';
  group.style.flexDirection = horizontal ? (parentStyle.direction === 'rtl' ? 'row-reverse' : 'row') : 'column';
  group.style.gap = parentStyle.gap;
  target.before(group);
  group.append(...(side < 2 ? [dragged, target] : [target, dragged]));
  for (const el of [dragged, target]) {
    el.style.position = 'relative'; el.style.inset = 'auto'; el.style.order = '0';
  }
  selectElement(group);
  showToast(horizontal ? '已创建横向组合容器' : '已创建纵向组合容器');
  return true;
}

// Central drag-move handler — works on BOTH parent and iframe documents
function onDragMove(e) {
  // Mouseup can be lost outside the window or intercepted by the imported page.
  if (!(e.buttons & 1)) { onDragUp(); return; }
  // Handle resize drag
  if (resizeData) {
    const { el, dir, startX, startY, startW, startH, startLeft, startTop, wasStatic, isInline } = resizeData;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let newW = startW, newH = startH;
    let shiftX = 0, shiftY = 0;

    if (dir.includes('e')) newW = Math.max(20, startW + dx);
    if (dir.includes('w')) { newW = Math.max(20, startW - dx); shiftX = startW - newW; }
    if (dir.includes('s')) newH = Math.max(20, startH + dy);
    if (dir.includes('n')) { newH = Math.max(20, startH - dy); shiftY = startH - newH; }

    el.style.width = newW + 'px';
    el.style.height = newH + 'px';

    // Shift position for w/n handles so the correct edge moves
    if ((shiftX !== 0 || shiftY !== 0) && wasStatic) el.style.position = 'relative';
    if (shiftX !== 0) el.style.left = (startLeft + shiftX) + 'px';
    if (shiftY !== 0) el.style.top = (startTop + shiftY) + 'px';

    if (!_resizeRAF) {
      _resizeRAF = requestAnimationFrame(() => {
        _resizeRAF = null;
        if (resizeData && resizeData.el.isConnected) {
          showHandles(resizeData.el);
          updateSizeInputs(
            parseFloat(resizeData.el.style.width) || resizeData.el.getBoundingClientRect().width,
            parseFloat(resizeData.el.style.height) || resizeData.el.getBoundingClientRect().height
          );
        }
      });
    }
    return;
  }

  // Handle drag-to-move
  if (_moveData) {
    const point = movePoint(e);
    _moveData.point = point;
    const dx = point.x - _moveData.startX;
    const dy = point.y - _moveData.startY;
    if (Math.abs(dx) < 3 && Math.abs(dy) < 3 && !_moveData.moved) return;
    if (!_moveData.moved) {
      _moveData.moved = true;
      showEditOutlines();
      if (_moveData.wasStatic) _moveData.el.style.position = 'relative';
      // Store original visual state & apply drag feedback
      const el = _moveData.el;
      _moveData._savedOutline = el.style.outline;
      _moveData._savedOutlineOffset = el.style.outlineOffset;
      _moveData._savedBoxShadow = el.style.boxShadow;
      _moveData._savedTransition = el.style.transition;
      _moveData._savedZIndex = el.style.zIndex;
      el.style.outline = '3px solid #6366f1';
      el.style.outlineOffset = '4px';
      el.style.boxShadow = '0 20px 50px rgba(99,102,241,.25), 0 8px 20px rgba(0,0,0,.12)';
      el.style.transition = 'box-shadow .15s';
      el.style.zIndex = '999';
      el.style.cursor = 'grabbing';
      document.body.style.cursor = 'grabbing';
      hideHandles();
    }
    const el = _moveData.el;
    el.style.left = (_moveData.startLeft + dx) + 'px';
    el.style.top = (_moveData.startTop + dy) + 'px';
    if (_moveData.overlay) updateGroupTarget();
    return;
  }

  // Handle label scrub
  if (_scrubState) {
    const { input, axis, startX, startY, startVal, unit } = _scrubState;
    const delta = axis === 'x' ? (e.clientX - startX) : (e.clientY - startY);
    if (Math.abs(delta) < 3 && !_scrubState.moved) return;
    _scrubState.moved = true;
    const step = e.shiftKey ? 10 : 1;
    let num = Math.max(0, startVal + delta * step);
    if (unit === 'px') num = Math.round(num);
    const formatted = unit === 'px' ? num + 'px' : num + unit;
    input.value = formatted;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

function onDragUp(e) {
  if (resizeData) {
    resizeData = null;
    if (_resizeRAF) { cancelAnimationFrame(_resizeRAF); _resizeRAF = null; }
    const d = getDoc();
    if (_mutationObserver && d && d.body) {
      try { _mutationObserver.observe(d.body, { childList:true, subtree:true, attributes:true, attributeFilter:['style'] }); } catch(e) {}
    }
    pushUndo();
    autoSizeIframe();
    if (selectedElement) showHandles(selectedElement);
  }
  if (_moveData) finishMove(e);
  finishScrub();
}

function finishScrub() {
  if (!_scrubState) return;
  const didMove = _scrubState.moved;
  _scrubState = null;
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  if (didMove) pushUndo();
}

function finishMove(e, cancel = false) {
  if (!_moveData) return;
  const move = _moveData, el = move.el;
  if (e?.type === 'mouseup' && move.moved) { move.point = movePoint(e); drawGroupTargets(); }
  const drop = e?.type === 'mouseup' ? move.drop : null;
  move.overlay?.remove();
  _moveData = null;
  showEditOutlines();
  el.style.cursor = '';
  document.body.style.cursor = '';
  if (move.moved) {
    // Restore visual state
    el.style.setProperty('outline', move._savedOutline || '', 'important');
    el.style.setProperty('outline-offset', move._savedOutlineOffset || '', 'important');
    el.style.boxShadow = move._savedBoxShadow || '';
    el.style.transition = move._savedTransition || '';
    el.style.zIndex = move._savedZIndex || '';
    if (cancel || (drop && groupTag(drop.target, el))) {
      if (move.originalStyle === null) el.removeAttribute('style');
      else el.setAttribute('style', move.originalStyle);
      if (!cancel) { deselectElement(); groupElements(el, drop.target, drop.side); }
    }
    _justMoved = true;
    if (!cancel) pushUndo();
    autoSizeIframe();
    if (el === selectedElement && el.isConnected) { showHandles(el); el.style.cursor = 'move'; }
  }
}

document.addEventListener('mousemove', onDragMove);
document.addEventListener('mouseup', onDragUp, true);
window.addEventListener('scroll', drawGroupTargets, true);
window.addEventListener('resize', drawGroupTargets);
window.addEventListener('blur', onDragUp);

/* ========================================================================
   INLINE TEXT EDITING
   ======================================================================== */
function isTextElement(el) {
  // Elements that should NEVER enter contentEditable mode
  const noEdit = ['html','head','body','img','br','hr','input','textarea','select','video','audio','canvas','iframe','script','style','svg','object','embed','map','area','source','track'];
  if (noEdit.includes(el.tagName.toLowerCase())) return false;
  // Any other element with visible text content is editable
  return !!(el.textContent && el.textContent.trim());
}

function isInlineText(el) {
  try { const w = getWin(); if (!w) return false; return w.getComputedStyle(el).display.startsWith('inline'); }
  catch(e) { return false; }
}

// Click-to-edit: place cursor at click position (called via setTimeout to defer past click processing)
function startEditAtCursor(el, cx, cy) {
  if (interactiveMode || selectedElement !== el || !el.isConnected || editSavedContent !== null) return;
  hideHandles();
  el.style.setProperty('outline', '2px solid #f59e0b', 'important');
  el.style.setProperty('outline-offset', '2px', 'important');
  el.contentEditable = 'true';
  editSavedContent = el.innerHTML;

  const doc = getDoc();
  el.addEventListener('blur', onEditBlur);
  el.addEventListener('keydown', onEditKey);
  el.focus();
  if (doc.activeElement !== el) {
    if (editSavedContent !== null) onEditBlur({ target: el });
    return;
  }

  try {
    const range = doc.caretRangeFromPoint(cx, cy);
    if (range) {
      const sel = getWin().getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  } catch(e) {}
}

// Double-click: select all text for quick replacement
function startEditFull(el) {
  selectElement(el);
  el.contentEditable = 'true';
  editSavedContent = el.innerHTML;

  const doc = getDoc();
  el.addEventListener('blur', onEditBlur);
  el.addEventListener('keydown', onEditKey);
  el.focus();
  if (doc.activeElement !== el) {
    if (editSavedContent !== null) onEditBlur({ target: el });
    return;
  }
  const range = doc.createRange();
  range.selectNodeContents(el);
  const sel = getWin().getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function onEditBlur(e) {
  const el = e.target;
  el.removeEventListener('blur', onEditBlur);
  el.removeEventListener('keydown', onEditKey);
  commitEdit(el);
}

function onEditKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
}

function commitEdit(el) {
  restoreSelection(el);
  if (el === selectedElement) {
    el.style.setProperty('outline', '2px solid #6d5dfc', 'important');
    el.style.setProperty('outline-offset', '2px', 'important');
    showHandles(el);
  } else {
    el.style.outline = '';
    el.style.outlineOffset = '';
  }
  if (el.innerHTML !== editSavedContent) {
    editSavedContent = null;
    pushUndo();
  }
  editSavedContent = null;
  autoSizeIframe();
}

/* ========================================================================
   PROPERTIES PANEL
   ======================================================================== */
function rgbToHex(color) {
  if (!color || color === 'transparent' || color === 'rgba(0, 0, 0, 0)') return '#000000';
  if (color.startsWith('#')) {
    if (color.length === 4) return '#' + color[1]+color[1]+color[2]+color[2]+color[3]+color[3];
    return color;
  }
  const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (m) return '#' + [m[1],m[2],m[3]].map(x => parseInt(x).toString(16).padStart(2,'0')).join('');
  return '#000000';
}

function escHtml(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function fmtPx(v) { const n = parseFloat(v); return n ? n + 'px' : ''; }
function fmtPxOr(v, fallback) { const n = parseFloat(v) || parseFloat(fallback); return n ? n + 'px' : ''; }

function updatePropsPanel(el) {
  if (!el) return;
  const body = document.getElementById('propsBody');
  const tag = el.tagName.toLowerCase();
  const computed = getWin().getComputedStyle(el);
  const s = el.style;

  let html = '';

  // Delete
  html += `<button class="prop-btn danger" onclick="deleteSelected()" style="width:100%;margin-bottom:4px">删除元素 &lt;${tag}&gt;</button>`;

  // Type
  html += `<div class="prop-group"><span class="prop-label">标签</span><span style="font-size:13px;font-weight:700">&lt;${tag}&gt;</span></div>`;

  // Text content
  if (isTextElement(el) && !['img','hr','br','input'].includes(tag)) {
    html += `<div class="prop-group"><span class="prop-label">文本内容</span>
      <textarea class="prop-textarea" id="propContent" rows="3">${escHtml(el.innerHTML)}</textarea></div>`;
  }

  // Image src
  if (tag === 'img') {
    html += `<div class="prop-group"><span class="prop-label">图片地址</span>
      <input class="prop-input" id="propSrc" value="${escHtml(el.src || '')}"></div>`;
  }

  // Link href
  if (tag === 'a') {
    html += `<div class="prop-group"><span class="prop-label">链接地址</span>
      <input class="prop-input" id="propHref" value="${escHtml(el.href || '')}"></div>`;
  }

  // Width & Height — four directional controls: L/R for width, U/D for height
  const curW = fmtPxOr(s.width, computed.width);
  const curH = fmtPx(s.height);
  html += `<div class="prop-group"><span class="prop-label">尺寸 <span class="reset-btn" onclick="resetStyles(['width','height','left','top','position'])" title="重置">↺</span></span>
    <div class="prop-row"><span class="prop-lbl" data-for="propSizeL" data-axis="x"><span class="ar">◀</span>L<span class="ar">▶</span></span><input class="prop-input" id="propSizeL" value="${curW}" placeholder="auto"></div>
    <div class="prop-row"><span class="prop-lbl" data-for="propSizeR" data-axis="x"><span class="ar">◀</span>R<span class="ar">▶</span></span><input class="prop-input" id="propSizeR" value="${curW}" placeholder="auto"></div>
    <div class="prop-row"><span class="prop-lbl" data-for="propSizeU" data-axis="y"><span class="ar">▲</span>U<span class="ar">▼</span></span><input class="prop-input" id="propSizeU" value="${curH}" placeholder="auto"></div>
    <div class="prop-row"><span class="prop-lbl" data-for="propSizeD" data-axis="y"><span class="ar">▲</span>D<span class="ar">▼</span></span><input class="prop-input" id="propSizeD" value="${curH}" placeholder="auto"></div>
  </div>`;

  // Font-related
  if (isTextElement(el)) {
    html += `<div class="prop-group"><span class="prop-label">字号 <span class="reset-btn" onclick="resetStyles(['fontSize'])" title="重置">↺</span></span>
      <div style="display:flex;gap:5px;align-items:center"><span class="scrub-icon" data-for="propFontSize" data-axis="x">⇔</span><input class="prop-input" id="propFontSize" value="${s.fontSize||''}" placeholder="${computed.fontSize}" style="flex:1"></div>`;
    html += `<div class="prop-group"><span class="prop-label">文字颜色 <span class="reset-btn" onclick="resetStyles(['color'])" title="重置">↺</span></span>
      <input class="prop-input" type="color" id="propColor" value="${rgbToHex(s.color||computed.color)}"></div>`;
    html += `<div class="prop-group"><span class="prop-label">背景色 <span class="reset-btn" onclick="resetStyles(['backgroundColor'])" title="重置">↺</span></span>
      <input class="prop-input" type="color" id="propBgColor" value="${rgbToHex(s.backgroundColor||computed.backgroundColor)}"></div>`;
    const align = s.textAlign || computed.textAlign || 'left';
    html += `<div class="prop-group"><span class="prop-label">对齐</span>
      <div class="align-group">
        <button class="align-btn${align==='left'||align==='start'?' active':''}" onclick="setStyle('textAlign','left')">&#8646;</button>
        <button class="align-btn${align==='center'?' active':''}" onclick="setStyle('textAlign','center')">&#8645;</button>
        <button class="align-btn${align==='right'?' active':''}" onclick="setStyle('textAlign','right')">&#8647;</button>
      </div>`;
  }

  // Padding & Border radius for containers + images
  if (['div','section','article','header','footer','main','nav','aside','button','img','figure','figcaption'].includes(tag)) {
    if (tag !== 'img') {
      html += `<div class="prop-group"><span class="prop-label">内边距 <span class="reset-btn" onclick="resetStyles(['paddingTop','paddingRight','paddingBottom','paddingLeft'])" title="重置">↺</span></span>
        <div class="prop-row"><span class="prop-lbl" data-for="propPadU" data-axis="y"><span class="ar">▲</span>T<span class="ar">▼</span></span><input class="prop-input" id="propPadU" value="${fmtPx(s.paddingTop)}" placeholder="0"></div>
        <div class="prop-row"><span class="prop-lbl" data-for="propPadD" data-axis="y"><span class="ar">▲</span>B<span class="ar">▼</span></span><input class="prop-input" id="propPadD" value="${fmtPx(s.paddingBottom)}" placeholder="0"></div>
        <div class="prop-row"><span class="prop-lbl" data-for="propPadL" data-axis="x"><span class="ar">◀</span>L<span class="ar">▶</span></span><input class="prop-input" id="propPadL" value="${fmtPx(s.paddingLeft)}" placeholder="0"></div>
        <div class="prop-row"><span class="prop-lbl" data-for="propPadR" data-axis="x"><span class="ar">◀</span>R<span class="ar">▶</span></span><input class="prop-input" id="propPadR" value="${fmtPx(s.paddingRight)}" placeholder="0"></div>
      </div>`;
    }
    html += `<div class="prop-group"><span class="prop-label">圆角 <span class="reset-btn" onclick="resetStyles(['borderRadius'])" title="重置">↺</span></span>
      <div style="display:flex;gap:5px;align-items:center"><span class="scrub-icon" data-for="propRadius" data-axis="x">⇔</span><input class="prop-input" id="propRadius" value="${fmtPx(s.borderRadius)}" placeholder="0px" style="flex:1"></div>`;
  }

  body.innerHTML = html;

  // Bind events — inputs accept typing only; drag-to-adjust is on the label/arrows/icons
  bindInput('propContent', (v) => { el.innerHTML = v; autoSizeIframe(); }, () => pushUndo());
  bindInput('propSrc', (v) => { el.src = v; }, () => pushUndo());
  bindInput('propHref', (v) => { el.href = v; }, () => pushUndo());
  bindInput('propColor', (v) => { el.style.color = v; }, () => pushUndo());
  bindInput('propBgColor', (v) => { el.style.backgroundColor = v; }, () => pushUndo());
  // Size: L (left edge), R (right edge), U (top edge), D (bottom edge)
  // L and R both represent width; U and D both represent height
  const syncSizeLR = (curW) => {
    const li = document.getElementById('propSizeL');
    const ri = document.getElementById('propSizeR');
    if (li && li !== document.activeElement) li.value = curW;
    if (ri && ri !== document.activeElement) ri.value = curW;
  };
  const syncSizeUD = (curH) => {
    const ui = document.getElementById('propSizeU');
    const di = document.getElementById('propSizeD');
    if (ui && ui !== document.activeElement) ui.value = curH;
    if (di && di !== document.activeElement) di.value = curH;
  };
  bindInput('propSizeR', (v) => {
    const n = parseFloat(v);
    el.style.width = n ? n + 'px' : '';
    if (n) syncSizeLR(n + 'px');
  }, () => pushUndo());
  bindInput('propSizeL', (v) => {
    const n = parseFloat(v);
    const oldW = parseFloat(el.style.width) || el.getBoundingClientRect().width;
    const oldLeft = parseFloat(el.style.left) || 0;
    el.style.width = n ? n + 'px' : '';
    if (n) {
      if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
      el.style.left = (oldLeft + oldW - n) + 'px';
      syncSizeLR(n + 'px');
    }
  }, () => pushUndo());
  bindInput('propSizeD', (v) => {
    const n = parseFloat(v);
    el.style.height = n ? n + 'px' : '';
    if (n) syncSizeUD(n + 'px');
  }, () => pushUndo());
  bindInput('propSizeU', (v) => {
    const n = parseFloat(v);
    const oldH = parseFloat(el.style.height) || el.getBoundingClientRect().height;
    const oldTop = parseFloat(el.style.top) || 0;
    el.style.height = n ? n + 'px' : '';
    if (n) {
      if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
      el.style.top = (oldTop + oldH - n) + 'px';
      syncSizeUD(n + 'px');
    }
  }, () => pushUndo());
  bindInput('propRadius', (v) => { const n=parseFloat(v); el.style.borderRadius = n?n+'px':''; }, () => pushUndo());
  bindInput('propPadU', (v) => { const n=parseFloat(v); el.style.paddingTop = n?n+'px':''; }, () => pushUndo());
  bindInput('propPadD', (v) => { const n=parseFloat(v); el.style.paddingBottom = n?n+'px':''; }, () => pushUndo());
  bindInput('propPadL', (v) => { const n=parseFloat(v); el.style.paddingLeft = n?n+'px':''; }, () => pushUndo());
  bindInput('propPadR', (v) => { const n=parseFloat(v); el.style.paddingRight = n?n+'px':''; }, () => pushUndo());
  bindInput('propFontSize', (v) => { el.style.fontSize = v; }, () => pushUndo());
}

function bindInput(id, onInput, onBlur) {
  const inp = document.getElementById(id);
  if (!inp) return;
  inp.addEventListener('input', () => onInput(inp.value));
  inp.addEventListener('blur', () => onBlur());
}

// Scrubby numeric input: mousedown + drag left/right to adjust value (like Photoshop)
// unit: 'px' → value stored as number, formatted as "Npx"; '' → value includes its own unit (e.g. "16px")
function bindScrubbyInput(id, unit, onChange, onEnd) {
  const inp = document.getElementById(id);
  if (!inp) return;

  let scrub = null;

  function extractUnit(raw) {
    if (unit === 'px') return 'px';
    const m = (raw || '').match(/[a-z%]+$/i);
    return m ? m[0] : 'px';
  }

  inp.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const raw = inp.value;
    scrub = {
      startX: e.clientX,
      startVal: parseFloat(raw) || 0,
      unit: extractUnit(raw),
      moved: false
    };
    inp.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'ew-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!scrub) return;
    const dx = e.clientX - scrub.startX;
    if (Math.abs(dx) < 3 && !scrub.moved) return;
    scrub.moved = true;
    inp.focus();
    const step = e.shiftKey ? 10 : 1;
    let num = Math.max(0, scrub.startVal + dx * step);
    if (unit === 'px') num = Math.round(num);
    const formatted = unit === 'px' ? num + 'px' : num + scrub.unit;
    inp.value = formatted;
    onChange(formatted);
  });

  document.addEventListener('mouseup', () => {
    if (!scrub) return;
    const didMove = scrub.moved;
    scrub = null;
    inp.style.cursor = '';
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    if (didMove) { inp.blur(); onEnd(); }
  });

  // Keyboard / paste: parse and re-format
  inp.addEventListener('input', () => {
    if (scrub) return;
    const raw = inp.value;
    const num = parseFloat(raw) || 0;
    const u = extractUnit(raw);
    const formatted = unit === 'px' ? num + 'px' : num + u;
    onChange(formatted);
  });
  inp.addEventListener('blur', () => { if (!scrub) onEnd(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp')   { e.preventDefault(); adjustInput(inp, (e.shiftKey?10:1), unit); onChange(inp.value); scheduleSave(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); adjustInput(inp, -(e.shiftKey?10:1), unit); onChange(inp.value); scheduleSave(); }
  });
}

function adjustInput(inp, delta, unit) {
  const raw = inp.value;
  let num = parseFloat(raw) || 0;
  num = Math.max(0, num + delta);
  if (unit === 'px') num = Math.round(num);
  const u = unit === 'px' ? 'px' : ((raw.match(/[a-z%]+$/i) || [])[0] || 'px');
  inp.value = unit === 'px' ? num + 'px' : num + u;
}

function setStyle(prop, value) {

/* ========================================================================
   UNDO / REDO (HTML snapshots of the iframe document)
   ======================================================================== */
const MAX_UNDO = 300;

function getDocHTML() {
  const doc = getDoc();
  if (!doc) return '';
  const root = doc.documentElement.cloneNode(true);
  const index = Array.from(doc.querySelectorAll('*')).indexOf(selectedElement);
  const selected = index === 0 ? root : root.querySelectorAll('*')[index - 1];
  if (selected) restoreSelection(selected);
  root.querySelectorAll('.__ve-handle').forEach(el => el.remove());
  return (doc.doctype ? new XMLSerializer().serializeToString(doc.doctype) + '\n' : '') + root.outerHTML;
}

function remember(html) {
  undoStack.push(html);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

// Store the previous state, not the just-edited state; ignore unchanged snapshots.
function recordChange() {
  if (!hasLoadedDocument || resizeData || _moveData || _scrubState) return false;
  const html = getDocHTML();
  if (!html || html === historyHTML) return false;
  remember(historyHTML);
  historyHTML = html;
  redoStack = [];
  updateUndoRedoButtons();
  return true;
}

function pushUndo() {
  clearTimeout(saveTimer);
  if (recordChange()) syncSource();
}

function scheduleSave() {
  if (!hasLoadedDocument) return;
  clearTimeout(saveTimer);
  setSaveStatus('修改待写入源文件…');
  saveTimer = setTimeout(pushUndo, 300);
}

function finishEditing() {
  if (!hasLoadedDocument) return;
  getDoc()?.activeElement?.blur();
  onDragUp();
  pushUndo();
}

// Serialize disk access, history restores and file switches.
function queueFileTask(action) {
  fileOperations++;
  fileTask = fileTask.then(action).catch(e => {
    setSaveStatus('文件同步失败，请保存重试：' + e.message, '#ef4444');
    return false;
  }).finally(() => fileOperations--);
  return fileTask;
}

async function setDocHTML(html) {
  deselectElement();
  await loadHTML(html);
  historyHTML = getDocHTML();
}

function restoreHistory(isRedo = false) {
  if (openingFile) return;
  return queueFileTask(async () => {
    finishEditing();
    const from = isRedo ? redoStack : undoStack, to = isRedo ? undoStack : redoStack;
    if (!from.length) return;
    const html = from[from.length - 1], current = historyHTML;
    await setDocHTML(html);
    from.pop();
    to.push(current);
    updateUndoRedoButtons();
    syncSource();
  });
}
function undo() { return restoreHistory(); }
function redo() { return restoreHistory(true); }

function setSaveStatus(message, color = '#d4a017') {
  const status = document.getElementById('saveStatus');
  status.textContent = message;
  status.parentElement.style.setProperty('--save-color', color);
}

function syncSource() {
  if (syncing) return fileTask;
  syncing = true;
  return queueFileTask(async () => {
    let writable;
    try {
      if (!hasLoadedDocument && historyHTML === savedHTML) return;
      if (!sourceFileHandle) {
        setSaveStatus(window.showSaveFilePicker ? '请点击“保存”关联源文件' : '浏览器不支持文件同步，请导出 HTML');
        return false;
      }
      do {
        const disk = await (await sourceFileHandle.getFile()).text();
        if (resizeData || _moveData || _scrubState) return;
        if (disk !== sourceHTML) {
          recordChange();
          if (historyHTML !== savedHTML) {
            // Concurrent external edits remain recoverable instead of disappearing.
            remember(disk);
            showToast('源文件同时发生修改，外部版本已保留，可撤销恢复');
          } else {
            if (editSavedContent !== null || document.getElementById('propsBody').contains(document.activeElement)) return;
            const previous = historyHTML;
            await setDocHTML(disk);
            remember(previous);
            savedHTML = historyHTML;
          }
          sourceHTML = disk;
          redoStack = [];
          updateUndoRedoButtons();
        }
        if (historyHTML !== savedHTML) {
          if (await sourceFileHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
            setSaveStatus('未获写入权限，点击“保存”授权', '#ef4444');
            return false;
          }
          const html = historyHTML;
          setSaveStatus('正在保存源文件…');
          writable = await sourceFileHandle.createWritable();
          await writable.write(html);
          if (await (await sourceFileHandle.getFile()).text() !== sourceHTML) {
            await writable.abort();
            writable = null;
            continue;
          }
          await writable.close();
          writable = null;
          sourceHTML = savedHTML = html;
        }
      } while (historyHTML !== savedHTML);
      setSaveStatus(hasLoadedDocument ? '源文件已同步 · 每 3 秒检查更新' : '源文件已保存，请重新打开', '#21c55d');
      return true;
    } finally {
      await writable?.abort().catch(() => {});
      syncing = false;
    }
  });
}

function updateUndoRedoButtons() {
  document.getElementById('btnUndo').disabled = undoStack.length === 0;
  document.getElementById('btnRedo').disabled = redoStack.length === 0;
  const u2 = document.getElementById('btnUndo2');
  const r2 = document.getElementById('btnRedo2');
  if (u2) u2.disabled = undoStack.length === 0;
  if (r2) r2.disabled = redoStack.length === 0;
}

/* ========================================================================
   IMPORT / EXPORT
   ======================================================================== */
const welcomeDropZone = document.getElementById('welcomeDropZone');

// Use capturing-phase window-level listeners to intercept BEFORE browser sees the drop
const _preventDrag = (e) => {
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer) { e.dataTransfer.dropEffect = 'copy'; e.dataTransfer.effectAllowed = 'copyAll'; }
};

window.addEventListener('dragenter', (e) => {
  _preventDrag(e);
  if (welcomeDropZone) welcomeDropZone.classList.add('drag-over');
}, true);
window.addEventListener('dragover', _preventDrag, true);
window.addEventListener('dragleave', (e) => {
  _preventDrag(e);
  if (e.screenX === 0 && e.screenY === 0) {
    if (welcomeDropZone) welcomeDropZone.classList.remove('drag-over');
  }
}, true);
async function handleFileDrop(e) {
  _preventDrag(e);
  if (welcomeDropZone) welcomeDropZone.classList.remove('drag-over');
  const file = e.dataTransfer?.files?.[0];
  if (file && isValidHTMLFile(file)) {
    const item = Array.from(e.dataTransfer.items).find(item => item.kind === 'file');
    const handle = item?.getAsFileSystemHandle?.();
    loadFile(file, await handle?.catch(() => null));
  }
}
window.addEventListener('drop', handleFileDrop, true);

// Welcome dropzone click triggers file input
if (welcomeDropZone) {
  welcomeDropZone.addEventListener('click', openFile);
}

async function openFile() {
  if (!window.showOpenFilePicker) return document.getElementById('fileInput').click();
  try {
    const [handle] = await window.showOpenFilePicker({ types: HTML_FILE_TYPES });
    const file = await handle.getFile();
    if (isValidHTMLFile(file)) await loadFile(file, handle);
    else showToast('请选择 HTML 文件');
  } catch (e) {
    if (e.name !== 'AbortError') showToast('打开失败: ' + e.message);
  }
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file && isValidHTMLFile(file)) loadFile(file);
  e.target.value = '';
}

function isValidHTMLFile(file) { return file.name.endsWith('.html') || file.name.endsWith('.htm') || file.type === 'text/html'; }

async function loadFile(file, handle = null) {
  if (openingFile || document.getElementById('btnSave').disabled) { showToast('请等待当前文件操作完成'); return; }
  openingFile = true;
  try {
    // Ask while the open/drop gesture is still active; background saves never prompt.
    await handle?.requestPermission({ mode: 'readwrite' }).catch(() => {});
    finishEditing();
    await syncSource();
    await queueFileTask(async () => {
      if (historyHTML !== savedHTML && !confirm('当前修改尚未写入源文件，是否放弃并打开其他文件？')) return;
      if (handle) file = await handle.getFile();
      await startEditing(await file.text(), handle, file.name);
    });
  } finally { openingFile = false; }
}

async function saveFile() {
  const button = document.getElementById('btnSave');
  if (!getDoc()) { showToast('没有可保存的内容'); return; }
  if (openingFile || button.disabled) return;
  if (!sourceFileHandle && !window.showSaveFilePicker) { showToast('当前浏览器不支持直接写回文件，请使用“导出 HTML”'); return; }
  button.disabled = true;
  try {
    const handle = sourceFileHandle || await window.showSaveFilePicker({ suggestedName: sourceFileName, types: HTML_FILE_TYPES });
    if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
      setSaveStatus('未获写入权限，点击“保存”授权', '#ef4444');
      return;
    }
    finishEditing();
    await queueFileTask(async () => {
      if (!sourceFileHandle) {
        sourceHTML = await (await handle.getFile()).text();
        sourceFileHandle = handle;
        savedHTML = ''; // The first save must also write an otherwise unedited file.
      }
    });
    if (await syncSource()) showToast('已保存 ' + handle.name);
  } catch (e) {
    if (e.name !== 'AbortError') setSaveStatus('保存失败：' + e.message, '#ef4444');
  } finally { button.disabled = false; }
}

async function exportFile(preview = false) {
  deselectElement();
  const doc = getDoc();
  if (!doc) { showToast('没有可导出的内容'); return; }
  const html = getDocHTML();
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  if (preview) { window.open(url, '_blank', 'noopener'); return; }
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 index.html');
}

async function exportPNG() {
  const doc = getDoc();
  if (!doc || !doc.body) { showToast('没有可导出的内容'); return; }
  deselectElement();
  const outlines = editOutlineSheet;
  showEditOutlines(false);
  showToast('正在生成全页 PNG...');
  try {
    const body = doc.body;
    const canvas = await html2canvas(body, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      width: body.scrollWidth,
      height: body.scrollHeight,
      windowWidth: body.scrollWidth,
      windowHeight: body.scrollHeight
    });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'page.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已导出 page.png');
    }, 'image/png');
  } catch(e) {
    showToast('PNG 导出失败: ' + e.message);
    console.error(e);
  } finally {
    if (outlines === editOutlineSheet) showEditOutlines();
  }
}

function toggleAddPanel() {

function addElement(type) {
  const doc = getDoc();
  if (!doc || !doc.body) return;

  let el;
  switch (type) {
    case 'heading':
      el = doc.createElement('h2');
      el.textContent = '新标题';
      el.style.cssText = 'font-size:28px;font-weight:700;color:#1e293b;margin:8px 0;';
      break;
    case 'text':
      el = doc.createElement('p');
      el.textContent = '在这里输入文本...';
      el.style.cssText = 'font-size:16px;color:#475569;line-height:1.6;margin:4px 0;';
      break;
    case 'image':
      el = doc.createElement('img');
      el.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200"><rect fill="#e2e8f0" width="400" height="200"/><text x="200" y="105" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">图片占位</text></svg>');
      el.style.cssText = 'width:400px;height:200px;border-radius:8px;display:block;';
      el.alt = 'placeholder';
      break;
    case 'button':
      el = doc.createElement('button');
      el.textContent = '按钮';
      el.style.cssText = 'padding:10px 24px;font-size:15px;font-weight:600;color:#fff;background:#6d5dfc;border:none;border-radius:8px;cursor:pointer;';
      break;
    case 'divider':
      el = doc.createElement('hr');
      el.style.cssText = 'border:none;border-top:1px solid #e2e8f0;margin:16px 0;';
      break;
    case 'container':
      el = doc.createElement('div');
      el.style.cssText = 'padding:16px;background:#f8fafc;border-radius:8px;min-height:80px;';
      el.innerHTML = '<p style="color:#94a3b8;font-size:14px;margin:0;">容器</p>';
      break;
  }

  if (el) {
    if (selectedElement && selectedElement.parentNode === doc.body) {
      selectedElement.parentNode.insertBefore(el, selectedElement.nextSibling);
    } else if (selectedElement && selectedElement.isConnected) {
      const tag = selectedElement.tagName.toLowerCase();
      if (['div','section','article','header','footer','main','nav','aside'].includes(tag)) {
        selectedElement.appendChild(el);
      } else {
        selectedElement.parentNode.insertBefore(el, selectedElement.nextSibling);
      }
    } else {
      doc.body.appendChild(el);
    }
    autoSizeIframe();
    selectElement(el);
    pushUndo();
    showToast('已添加');
  }

  document.getElementById('addPanel').classList.remove('show');
}

/* ========================================================================
   KEYBOARD SHORTCUTS
   ======================================================================== */
function onShortcut(e) {
  if (e.key === 'Escape' && _moveData) { e.preventDefault(); finishMove(null, true); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))) { e.preventDefault(); redo(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s') { e.preventDefault(); saveFile(); }
  if (editSavedContent !== null || e.target.ownerDocument !== document) return;
  if ((e.key==='Delete'||e.key==='Backspace') && selectedElement && document.activeElement===document.body) {
    e.preventDefault(); deleteSelected();
  }
  if (e.key==='Escape') { deselectElement(); document.getElementById('addPanel').classList.remove('show'); }
}
document.addEventListener('keydown', onShortcut);

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);

// Label/icon scrub: mousedown on directional arrows or scrub icons starts drag-to-adjust
document.getElementById('propsBody').addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  // Find the scrub trigger — could be a label, vstack, icon, or an arrow sibling
  let trigger = e.target.closest('[data-for]');
  if (!trigger) {
    const row = e.target.closest('.prop-row');
    if (row) trigger = row.querySelector('[data-for]');
  }
  if (!trigger || e.button !== 0) return;
  e.preventDefault();

  const inputId = trigger.dataset.for;
  const axis = trigger.dataset.axis || 'x';
  const inp = document.getElementById(inputId);
  if (!inp) return;

  const raw = inp.value;
  const m = (raw || '').match(/[a-z%]+$/i);
  const unit = m ? m[0] : 'px';

  _scrubState = {
    input: inp,
    axis: axis,
    startX: e.clientX,
    startY: e.clientY,
    startVal: parseFloat(raw) || 0,
    unit: unit,
    moved: false
  };
  inp.focus();
  document.body.style.userSelect = 'none';
  document.body.style.cursor = axis === 'x' ? 'ew-resize' : 'ns-resize';
});

// File writes are asynchronous; keep the tab open until pending edits reach disk.
window.addEventListener('beforeunload', (e) => {
  finishEditing();
  if (fileOperations || historyHTML !== savedHTML) { e.preventDefault(); e.returnValue = ''; }
});
document.getElementById('propsBody').addEventListener('input', scheduleSave);

  undoStack = []; redoStack = [];
  updateUndoRedoButtons();
  setSaveStatus(handle ? '源文件已关联 · 每 3 秒检查更新' : '请点击“保存”关联源文件');
